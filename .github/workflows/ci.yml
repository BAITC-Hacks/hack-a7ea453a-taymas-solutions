name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NVIDIA_API_KEY: ''
  NVIDIA_MODEL: ''
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the entire Python suite (archive-only cases report skips)
        run: |
          mkdir -p .ci-artifacts
          python -m pip freeze > .ci-artifacts/python-environment.txt
          python -m pytest tests -ra --junitxml=.ci-artifacts/python.xml | tee .ci-artifacts/python.log
      - name: Python diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-diagnostics
          path: .ci-artifacts/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn

  browser:
    name: Frontend + local Copilot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix frontend
          cd frontend
          npx --no-install playwright install --with-deps chromium
      - name: Synthetic Parquet → reproducible CSV → evidence evaluation
        run: |
          mkdir -p .ci-artifacts
          test ! -e out
          python -m scripts.ci_fixture --data .ci-data
          python -m money_graph --data .ci-data --out out --check-repro | tee .ci-artifacts/pipeline.log
          python -m agent_tools.evaluation --out out | tee .ci-artifacts/evaluation.log
      - name: Frontend unit tests and production build
        run: |
          npm test --prefix frontend | tee .ci-artifacts/frontend.log
          npm run build --prefix frontend | tee .ci-artifacts/build.log
      - name: Existing browser scenarios against the local Python API
        run: bash scripts/ci-browser.sh
      - name: Browser diagnostics (synthetic data only)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics
          path: |
            .ci-artifacts/
            frontend/playwright-report/
            frontend/test-results/
            out/run_report.json
            out/run_report.md
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn

  gate:
    name: CI gate
    if: always()
    needs: [python, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require both checks to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$BROWSER_RESULT" = success
