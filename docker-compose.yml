services:
  pipeline:
    profiles: ["batch"]
    build:
      context: .
      dockerfile: Dockerfile
      target: pipeline
    image: ${PIPELINE_IMAGE:-money-graph-pipeline:local}
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    command: ["--data", "/app/data", "--out", "/app/out", "--check-repro"]
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /app/data
        read_only: true
      - type: bind
        source: ${OUT_DIR:-./out}
        target: /app/out
    restart: "no"

  copilot:
    build:
      context: .
      dockerfile: Dockerfile
      target: pipeline
    image: ${PIPELINE_IMAGE:-money-graph-pipeline:local}
    # Owns the named state volume prepared for UID 10001 in the image.
    # Only the batch pipeline needs the host UID for its writable bind mount.
    entrypoint: ["python", "-m", "agent_orchestrator.server"]
    command: ["--out", "/app/out", "--state", "/app/state", "--host", "0.0.0.0"]
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
    volumes:
      - datasets:/app/state
      - type: bind
        source: ${OUT_DIR:-./out}
        target: /app/out
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8765/api/datasets/active', timeout=2)); assert 'dataset_id' in r"]
      interval: 3s
      timeout: 3s
      start_period: 5s
      retries: 20
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    image: ${UI_IMAGE:-money-graph-ui:local}
    depends_on:
      copilot:
        condition: service_started
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:80"
    volumes:
      - type: bind
        source: ${OUT_DIR:-./out}
        target: /usr/share/nginx/html/out
        read_only: true
    restart: unless-stopped

volumes:
  datasets:
