services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      target: pipeline
    image: money-graph-pipeline:local
    command: ["--data", "/app/data", "--out", "/app/out", "--check-repro"]
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
      - type: bind
        source: ./out
        target: /app/out
    restart: "no"

  copilot:
    build:
      context: .
      dockerfile: Dockerfile
      target: pipeline
    image: money-graph-pipeline:local
    entrypoint: ["python", "-m", "agent_orchestrator.server"]
    command: ["--out", "/app/out", "--host", "0.0.0.0"]
    depends_on:
      pipeline:
        condition: service_completed_successfully
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
    volumes:
      - type: bind
        source: ./out
        target: /app/out
        read_only: true
    restart: unless-stopped

  # PAN-55: необязательный бонус — предвычисление устойчивости сети для UI (≈1 мин).
  # UI от него не зависит: пока файла нет, раздел сообщает, что расчёт не выполнен.
  resilience:
    image: money-graph-pipeline:local
    entrypoint: ["python", "-m", "analytics.resilience_export"]
    command: ["--out", "/app/out"]
    depends_on:
      pipeline:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ./out
        target: /app/out
    restart: "no"

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    image: money-graph-ui:local
    depends_on:
      pipeline:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:80"
    volumes:
      - type: bind
        source: ./out
        target: /usr/share/nginx/html/out
        read_only: true
    restart: unless-stopped
