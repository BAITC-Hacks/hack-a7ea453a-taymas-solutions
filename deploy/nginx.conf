server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /out/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /api/copilot/ {
        # Resolve at request time: a stopped Copilot must not prevent UI startup.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $copilot_upstream copilot:8765;
        proxy_pass http://$copilot_upstream;
        proxy_set_header Host 127.0.0.1;
        proxy_read_timeout 15s;
        proxy_connect_timeout 2s;
        client_max_body_size 8k;
        add_header Cache-Control "no-store" always;
    }

    location /api/datasets/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $datasets_upstream copilot:8765;
        proxy_pass http://$datasets_upstream;
        proxy_set_header Host 127.0.0.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 2s;
        client_body_timeout 60s;
        client_max_body_size 32m;
        error_page 413 = @upload_too_large;
        add_header Cache-Control "no-store" always;
    }

    location @upload_too_large {
        default_type application/json;
        return 413 '{"error":"Размер загрузки превышает 32 МиБ. Каждый файл должен быть не больше 10 МиБ."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
